name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt numpy safetensors pytest ruff

      - name: Validate project metadata and release archive
        shell: bash
        run: |
          version="$(python - <<'PY'
          import pathlib
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: ${version}" >&2
            exit 1
          fi
          archive="/tmp/ComfyUI-H3-Continuum-v${version}.zip"
          git archive \
            --format=zip \
            --prefix="ComfyUI-H3-Continuum-v${version}/" \
            --output="${archive}" \
            HEAD
          ARCHIVE="${archive}" VERSION="${version}" python - <<'PY'
          import os
          import zipfile

          prefix = f"ComfyUI-H3-Continuum-v{os.environ['VERSION']}/"
          required = {
              prefix + "__init__.py",
              prefix + "pyproject.toml",
              prefix + "v2/sequence.py",
              prefix + "v3/nodes.py",
              prefix + "web/project_id.js",
              prefix + "web/reference_autogrow.js",
          }
          with zipfile.ZipFile(os.environ["ARCHIVE"]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"release archive is missing required files: {missing}")
          PY

      - name: Run targeted Ruff checks
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Check JavaScript syntax
        run: |
          node --check web/project_id.js
          node --check web/reference_autogrow.js

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt numpy safetensors pytest ruff build

      - name: Validate package build
        run: python -m pip wheel --no-deps --wheel-dir /tmp/h3-continuum-wheel .

      - name: Run targeted Ruff checks
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Check JavaScript syntax
        run: |
          node --check web/project_id.js
          node --check web/reference_autogrow.js

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
